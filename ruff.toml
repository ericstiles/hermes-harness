# Lint and format settings for the hermes-review Python code (lib/pr_review, tests/py).
# Checked by tests/run_tests.sh, so results do not depend on anyone's global ruff config.
line-length = 100
target-version = "py310"  # bin/hermes-review requires python >= 3.10
src = ["lib", "tests/py"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[lint.isort]
known-first-party = ["pr_review"]
